# Setup monitors
# See https://wiki.hyprland.org/Configuring/Monitors/
#monitor=,preferred,auto,auto

# Dual monitor example on G15 Strix
# eDP-1 is the built in monitor while DP-1 is external
# Both monitors here are at 1440 and 165Hz
# DP-1 is on the left and  eDP-1 is on the right
monitor=eDP-1,1920x1080@144,0x0,1,vrr,1
monitor= desc:SVE S1 S1 20250912, 1920x1080@60, 1920x0, 1
monitor= , preferred, auto, 1
#monitor=eDP-1,2560x1440@165,2560x0,2

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = XCURSOR_THEME,Chicago95_Animated_Hourglass_Cursors
env = XCURSOR_SIZE,16

$files = thunar
$browser = brave --enable-features=UseOzonePlatform --ozone-platform=wayland
$editor = visual-studio-code-bin

# Execute your favorite apps at launch
exec-once = ~/.config/hypr/xdg-portal-hyprland
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = awww-daemon &
exec-once = sleep 1 && awww img ~/Wallpapers/planet_minimal.png --transition-type wipe
exec-once = waybar
exec-once = mako
exec-once = blueman-applet
exec-once = nm-applet --indicator
exec-once = clpise -listen
# exec-once = wl-paste --watch cliphist store
exec-once = libinput-gestures
# exec-once = wl-clip-persist &
exec-once = clipman &
# exec-once = copyq &
exec-once = sh -c 'eval "$(gnome-keyring-daemon --start --components=secrets,ssh,pkcs11)" && dbus-update-activation-environment --systemd SSH_AUTH_SOCK GPG_AGENT_INFO'
exec-once = hyprpm reload -n
exec-once = bash -c 'AC=$(cat /sys/class/power_supply/AC0/online 2>/dev/null || cat /sys/class/power_supply/AC/online); [ "$AC" = "0" ] && ~/.config/hypr/scripts/on-battery.sh || ~/.config/hypr/scripts/on-ac.sh'

cursor {
    no_hardware_cursors = true
}

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us
    kb_variant =
    kb_model = pc105
    kb_options =
    kb_rules =

    repeat_delay = 300
    repeat_rate = 50

    follow_mouse = 1

    touchpad {
        natural_scroll = yes
	    scroll_factor = 0.5
    }

    sensitivity = 0  # -1.0 - 1.0, 0 means no modification.
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    
    gaps_in = 3
    gaps_out = 7
    border_size = 2
    #col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.active_border=rgb(cdd6f4)
    col.inactive_border = rgba(595959aa)

    layout = dwindle
}

misc {
    disable_hyprland_logo = yes
    vrr = true
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 5
    blur{
      enabled = false
      size = 10
      passes = 2
      ignore_opacity = true
      new_optimizations = true
    }
    
}

animations {
    enabled = yes

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more
    bezier = myBezier, 0.10, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier, slide
    animation = windowsOut, 1, 7, myBezier, slide
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    # pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
}

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    gesture = 3, horizontal, workspace
    workspace_swipe_distance = 150
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#executing for more
device{
    name = epic-mouse-v1
    sensitivity = -0.5
}

# Example windowrule v1
#windowrule = float, ^(kitty)$
windowrule = float on, match:title ^btop$
windowrule = float on, match:title ^update-sys$
windowrule = float on, match:class ^clipse$
windowrule = size 622 652, match:class ^(clipse)$
#windowrule = opacity 0.9 0.8,^(firefox)$


# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# rules below would make the specific app transparent
windowrule = opacity 0.8 0.8, match:class ^(kitty)$
windowrule = opacity 0.8 0.8, match:class ^(pavucontrol)$
windowrule = opacity 0.8 0.8, match:class ^(blueman-manager)$
windowrule = animation popin, match:class ^(kitty)$, match:title ^(update-sys)$
windowrule = animation popin, opacity 0.8 0.8, match:class ^(thunar)$
windowrule = animation popin, match:class ^(chromium)$
windowrule = move (cursor_x+(-(monitor_w*0.03))) (cursor_y+(-(monitor_h*1.05))), no_anim on, match:class ^(wofi)$
windowrule = opacity 0.8 0.8, match:class ^(org.qbittorrent.qBittorrent)$
windowrule = opacity 0.9 0.9, match:class ^(Spotify)$
windowrule = opacity 0.9 0.9, match:class ^(thunderbird)$


# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = , XF86Sleep, exec, systemctl suspend-then-hibernate
bind = $mainMod, K, exec, kitty  #open the terminal
bind = $mainMod, Q, killactive, # close the active window
bind = $mainMod, L, exec, hyprlock  # Lock the screen
bind = $mainMod SHIFT, M, exit, # Exit Hyprland all together no (force quit Hyprland)
bind = $mainMod, E, exec, thunar # Show the graphical file browser
bind = $mainMod, V, togglefloating, # Allow a window to float
bind = $mainMod, SPACE, exec, ~/.local/scripts/win95-start.sh
bind = $mainMod, P, pseudo, # qdwindle
# bind = $mainMod, J, dwindle:togglesplit, # removed
bind = $mainMod, S, exec, bash -c 'grim -g "$(slurp)" - | swappy -f -'
# bind = ALT, V, exec, cliphist list | wofi -dmenu | cliphist decode | wl-copy # open clipboard manager
bind = $mainMod, H, exec, kitty --class clipse -e clipse

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

#Resize submap binds
bind=$mainMod,R,submap,resize
submap=resize
binde=,right,resizeactive,30 0
binde=SHIFT,right,resizeactive,10 0
binde=,left,resizeactive,-30 0
binde=SHIFT,left,resizeactive,-10 0
binde=,up,resizeactive,0 -30
binde=SHIFT,up,resizeactive,0 -10
binde=,down,resizeactive,0 30
binde=SHIFT,down,resizeactive,0 10
bindrt=$mainMod,R,submap,reset 
submap=reset

#Moving windows binds
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# launches wofi GPU mode picker
bind = $mainMod SHIFT, G, exec, ~/.config/wofi/scripts/wofi-launch-nogpu.sh

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf
source = ~/.config/hypr/env_var.conf

#Custom
bind = $mainMod, F, fullscreen, 1
bind = $mainMod SHIFT, F, fullscreen

# Monitor Brightness
bind = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Keyboard Brightness  
bind = , XF86KbdBrightnessUp, exec, asusctl -k low
bind = , XF86KbdBrightnessDown, exec, asusctl -k high

# Audio volume controls
bind = , XF86AudioRaiseVolume, exec, pamixer -i 5
bind = , XF86AudioLowerVolume, exec, pamixer -d 5
# Optional: Microphone mute (PipeWire-specific)
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
# F1 - Mute toggle
bind = , XF86AudioMute, exec, pamixer -t
# Super+T - Refresh rate toggle (Super + R is taken by resize submap)
bind = $mainMod, T, exec, ~/.config/hypr/scripts/refresh-toggle.sh

# Headphones Pause/Play control
bindl = , XF86AudioPlay, exec, playerctl play-pause
# Next Song / Previous
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous




# Win95 title bar config
plugin {
    borders-plus-plus {
	add_borders = 2
	col.border_1 = rgb(ffffff) # inner highlight
	col.border_2 = rgb(404040)
	border_sizes_1 = 1
	border_sizes_2 = 1
	natural_rounding = false
    }
    hyprbars {
        bar_height = 20
        bar_color = rgb(000080)
        bar_text_color = rgb(ffffff)
        bar_text_size = 11
        bar_precedence_over_border = true

	hyprbars-button = rgb(c0c0c0), 14, 🗙, hyprctl dispatch killactive
	hyprbars-button = rgb(c0c0c0), 14, 🗖, hyprctl dispatch fullscreen 1
	hyprbars-button = rgb(c0c0c0), 14, 🗕, ~/.config/hypr/scripts/minimize.sh
    
    }
}

# Sharp corners + Win95 borders
general {
    border_size = 2
    col.active_border = rgb(000080)
    col.inactive_border = rgb(808080)
}

decoration {
    rounding = 0
}
